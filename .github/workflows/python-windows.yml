name: Python 3.14.6 Windows standalone
on:
  push:
    branches: [main, 'feat/python-standalone-3146', 'feat/python-simple-export']
    paths: ['xml_analyzer/**', 'tests_python/**', '*.py', '*.cmd', 'scripts/*python.py', 'pyproject.toml', '.python-version', 'requirements-build-windows.txt', '.github/workflows/python-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
          architecture: x64
      - name: Verify exact Python and native Tk
        run: python -c "import sys,tkinter; assert sys.version_info[:3]==(3,14,6); r=tkinter.Tk(); r.withdraw(); r.update(); r.destroy()"
      - name: Package offline HTML guide and Python source
        run: |
          python scripts/package_user_guide.py
          python scripts/package_python.py
      - name: Unit tests, native Windows integration, frozen build and isolated-runtime test
        run: python build_windows.py
      - name: Check whether the processing engine changed
        id: scope
        shell: python
        run: |
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff-tree', '--root', '--no-commit-id', '--name-only', '-r', 'HEAD'], text=True).splitlines()
          engine = {'xml_analyzer/parser.py', 'xml_analyzer/storage.py', 'xml_analyzer/comparison.py', 'xml_analyzer/extraction.py', 'xml_analyzer/simple_export.py', 'xml_analyzer/writers.py', 'xml_analyzer/models.py', 'scripts/performance_python.py'}
          required = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or bool(engine.intersection(paths))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('performance=' + str(required).lower() + '\n')
      - name: Synthetic large XML and streaming XLSX/CSV performance
        if: steps.scope.outputs.performance == 'true'
        run: python scripts/performance_python.py --cases 1,10,100,500,million --output artifacts/python-windows-performance.json
      - name: Upload Windows package and verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enterprise-xml-analyzer-windows-python3146
          path: |
            artifacts/enterprise-xml-analyzer-windows-x64-python3146.zip
            artifacts/enterprise-xml-analyzer-user-guide.html
            artifacts/enterprise-xml-analyzer-user-guide.zip
            artifacts/enterprise-xml-analyzer-python-source.zip
            artifacts/python-windows-frozen-selftest.json
            artifacts/python-windows-performance.json
            artifacts/python-selftest-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Capture Windows user guide screens
        run: python scripts/capture_guide_python.py
      - name: Upload user guide screens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-user-guide-screens
          path: artifacts/python-guide/
          if-no-files-found: error
          retention-days: 14
